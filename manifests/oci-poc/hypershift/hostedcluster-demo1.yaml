# Generated by `hypershift create cluster none --render` at openshift/hypershift
# 253c3f5c790d and edited: all four services published as hostname Routes
# through the per-cluster router, PodSecurity override for a non-OpenShift
# management cluster, SingleReplica. Secrets referenced here are created by
# scripts/oci-poc-hypershift.sh from local files and never committed.
# The guest's default ingress publishes as a load balancer from creation (the
# HCCO only applies this when it first creates the IngressController); the
# Service is made internal with OCI annotations by oci-poc-guest-oci.sh.
apiVersion: hypershift.openshift.io/v1beta1
kind: HostedCluster
metadata:
  name: demo1
  namespace: clusters
  annotations:
    hypershift.openshift.io/pod-security-admission-label-override: privileged
spec:
  autoscaling: {}
  configuration: {}
  controllerAvailabilityPolicy: SingleReplica
  dns:
    baseDomain: hcp.oci.hypershell.app
  etcd:
    managed:
      storage:
        persistentVolume:
          size: 8Gi
          storageClassName: oci-bv
        type: PersistentVolume
    managementType: Managed
  fips: false
  infraID: demo1-wzndr
  infrastructureAvailabilityPolicy: SingleReplica
  networking:
    clusterNetwork:
    - cidr: 10.132.0.0/14
    networkType: OVNKubernetes
    serviceNetwork:
    - cidr: 172.31.0.0/16
  olmCatalogPlacement: management
  platform:
    type: None
  pullSecret:
    name: demo1-pull-secret
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.22.18-x86_64
  secretEncryption:
    aescbc:
      activeKey:
        name: demo1-etcd-encryption-key
    type: aescbc
  services:
  - service: APIServer
    servicePublishingStrategy:
      type: Route
      route:
        hostname: api.demo1.hcp.oci.hypershell.app
  - service: OAuthServer
    servicePublishingStrategy:
      type: Route
      route:
        hostname: oauth.demo1.hcp.oci.hypershell.app
  - service: Konnectivity
    servicePublishingStrategy:
      type: Route
      route:
        hostname: konnectivity.demo1.hcp.oci.hypershell.app
  - service: Ignition
    servicePublishingStrategy:
      type: Route
      route:
        hostname: ignition.demo1.hcp.oci.hypershell.app
  sshKey:
    name: demo1-ssh-key
  operatorConfiguration:
    ingressOperator:
      endpointPublishingStrategy:
        type: LoadBalancerService
        loadBalancer:
          scope: External
          dnsManagementPolicy: Unmanaged
