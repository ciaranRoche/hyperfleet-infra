# NodePool spec.config entry. Sets the kubelet provider ID and the zone, region
# and instance-type labels from OCI instance metadata. On platform None the
# kubelet runs with no cloud provider, so nothing else sets them, and the
# block volume CSI driver cannot pick an availability domain without the zone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oci-kubelet-providerid
  namespace: clusters
data:
  config: "apiVersion: machineconfiguration.openshift.io/v1\nkind: MachineConfig\n\
    metadata:\n  name: 50-worker-oci-kubelet-providerid\n  labels:\n    machineconfiguration.openshift.io/role:\
    \ worker\nspec:\n  config:\n    ignition:\n      version: 3.4.0\n    storage:\n\
    \      files:\n      - path: /usr/local/bin/oci-kubelet-providerid\n        mode:\
    \ 493\n        overwrite: true\n        contents:\n          source: data:text/plain;charset=utf-8;base64,\n\
    \    systemd:\n      units:\n      - name: oci-kubelet-providerid.service\n  \
    \      enabled: true\n        contents: '[Unit]\n\n          Description=Set the\
    \ kubelet provider ID from OCI instance metadata\n\n          After=network-online.target\n\
    \n          Wants=network-online.target\n\n          Before=kubelet.service kubelet-dependencies.target\n\
    \n\n          [Service]\n\n          Type=oneshot\n\n          RemainAfterExit=yes\n\
    \n          ExecStart=/usr/local/bin/oci-kubelet-providerid\n\n\n          [Install]\n\
    \n          WantedBy=kubelet-dependencies.target multi-user.target\n\n       \
    \   '\n"
