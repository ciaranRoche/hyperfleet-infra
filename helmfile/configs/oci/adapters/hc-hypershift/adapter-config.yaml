adapter:
  name: hc-hypershift

debug_config: false
log:
  level: info

clients:
  hyperfleet_api:
    base_url: CHANGE_ME
    version: v1
    timeout: 10s
    retry_attempts: 3
    retry_backoff: exponential

  broker:
    subscription_id: CHANGE_ME
    topic: CHANGE_ME

  # Direct transport to the cluster the adapter runs on, which is the
  # HyperShift management cluster; in-cluster service account.
  kubernetes:
    api_version: "v1"
