# HyperFleet Adapter task configuration — desire-based delivery (POC)
# Adapter1: Creates a ConfigMap per cluster via desire transport
params:
  - name: "clusterId"
    source: "event.id"
    type: "string"
    required: true

  - name: "generation"
    source: "event.generation"
    type: "int"
    required: true

  - name: "namespace"
    source: "env.NAMESPACE"
    type: "string"

preconditions:
  - name: "clusterStatus"
    api_call:
      method: "GET"
      url: "/clusters/{{ .clusterId }}"
      timeout: 10s
      retry_attempts: 3
      retry_backoff: "exponential"
    capture:
      - name: "clusterName"
        field: "name"
      - name: "generation"
        field: "generation"
      - name: "is_deleting"
        expression: "clusterStatus.?deleted_time.hasValue()"
      - name: "placementClusterName"
        expression: "\"cluster1\""
      - name: "clusterNotReconciled"
        expression: |
          status.conditions.filter(c, c.type == "Reconciled").size() > 0
            ? status.conditions.filter(c, c.type == "Reconciled")[0].status != "True"
            : true
      - name: "clusterReconciledTTL"
        expression: |
          (timestamp(now()) - timestamp(
            status.conditions.filter(c, c.type == "Reconciled").size() > 0
              ? status.conditions.filter(c, c.type == "Reconciled")[0].last_transition_time
              : now()
          )).getSeconds() > 300

  - name: "validationCheck"
    expression: |
      clusterNotReconciled || clusterReconciledTTL || is_deleting

resources:
  - name: "clusterConfigMap"
    transport:
      client: "desire"
      desire:
        target_cluster: "{{ .placementClusterName }}"
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ .clusterId | lower }}-adapter1-configmap"
        namespace: "{{ .namespace }}"
        labels:
          hyperfleet.io/cluster-id: "{{ .clusterId }}"
          hyperfleet.io/cluster-name: "{{ .clusterName }}"
          hyperfleet.io/adapter: "{{ .adapter.name }}"
        annotations:
          hyperfleet.io/generation: "{{ .generation }}"
      data:
        cluster_id: "{{ .clusterId }}"
        cluster_name: "{{ .clusterName }}"
    discovery:
      namespace: "{{ .namespace }}"
      by_name: "{{ .clusterId | lower }}-adapter1-configmap"
    lifecycle:
      delete:
        propagationPolicy: "Background"
        when:
          expression: "is_deleting"

post:
  payloads:
    - name: "statusPayload"
      build:
        adapter: "{{ .adapter.name }}"
        conditions:
          - type: "Applied"
            status:
              expression: |
                resources.?clusterConfigMap.?metadata.?creationTimestamp.hasValue() ? "True" : "False"
            reason:
              expression: |
                resources.?clusterConfigMap.?metadata.?creationTimestamp.hasValue() ? "ConfigMapCreated" : "ConfigMapNotCreated"
            message:
              expression: |
                resources.?clusterConfigMap.?metadata.?creationTimestamp.hasValue()
                  ? "ConfigMap created successfully"
                  : "ConfigMap has not been created yet"
          - type: "Available"
            status:
              expression: |
                resources.?clusterConfigMap.?data.?cluster_id.hasValue() ? "True" : "False"
            reason:
              expression: |
                resources.?clusterConfigMap.?data.?cluster_id.hasValue()
                  ? "ConfigMapDataPopulated"
                  : "ConfigMapDataMissing"
            message:
              expression: |
                resources.?clusterConfigMap.?data.?cluster_id.hasValue()
                  ? "ConfigMap data keys are populated"
                  : "ConfigMap data keys are not yet populated"
          - type: "Health"
            status:
              expression: |
                adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                ? "True"
                : "False"
            reason:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                ? "ExecutionFailed:" + adapter.?executionError.?phase.orValue("unknown")
                : adapter.?resourcesSkipped.orValue(false)
                  ? "ResourcesSkipped"
                  : "Healthy"
            message:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                ? "Adapter failed: " + adapter.?executionError.?message.orValue("no details")
                : adapter.?resourcesSkipped.orValue(false)
                  ? "Resources skipped: " + adapter.?skipReason.orValue("unknown reason")
                  : "Adapter execution completed successfully"
          - type: "Finalized"
            status:
              expression: |
                !is_deleting
                  ? "False"
                  : (!resources.?clusterConfigMap.hasValue() ? "True" : "False")
            reason:
              expression: |
                !is_deleting
                  ? "ResourceActive"
                  : (!resources.?clusterConfigMap.hasValue() ? "CleanupConfirmed" : "CleanupInProgress")
            message:
              expression: |
                !is_deleting
                  ? "Resource is active"
                  : (!resources.?clusterConfigMap.hasValue()
                      ? "All resources deleted successfully"
                      : "Deletion in progress")
        observed_generation:
          expression: "generation"
        observed_time: "{{ now | date \"2006-01-02T15:04:05Z07:00\" }}"
        data:
          configmap:
            name:
              expression: |
                resources.?clusterConfigMap.?metadata.?name.orValue("")
            clusterId:
              expression: |
                resources.?clusterConfigMap.?data.?cluster_id.orValue("")

  post_actions:
    - name: "reportClusterStatus"
      api_call:
        method: "PUT"
        url: "/clusters/{{ .clusterId }}/statuses"
        headers:
          - name: "Content-Type"
            value: "application/json"
        body: "{{ .statusPayload }}"
