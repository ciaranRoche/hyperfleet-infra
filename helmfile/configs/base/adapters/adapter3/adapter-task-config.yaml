# HyperFleet Adapter task configuration — desire-based delivery (POC)
# Adapter3: Creates a ConfigMap per nodepool via desire transport
params:
  - name: "nodepoolId"
    source: "event.id"
    type: "string"
    required: true

  - name: "clusterId"
    source: "event.owner_references.id"
    type: "string"
    required: true

  - name: "generation"
    source: "event.generation"
    type: "int"
    required: true

  - name: "namespace"
    source: "env.NAMESPACE"
    type: "string"

preconditions:
  - name: "nodepoolStatus"
    api_call:
      method: "GET"
      url: "/clusters/{{ .clusterId }}/nodepools/{{ .nodepoolId }}"
      timeout: 10s
      retry_attempts: 3
      retry_backoff: "exponential"
    capture:
      - name: "nodepoolName"
        field: "name"
      - name: "observedGeneration"
        field: "generation"
      - name: "is_deleting"
        expression: "nodepoolStatus.?deleted_time.hasValue()"
      - name: "placementClusterName"
        expression: "\"cluster1\""
      - name: "nodepoolNotReconciled"
        expression: |
          status.conditions.filter(c, c.type == "Reconciled").size() > 0
            ? status.conditions.filter(c, c.type == "Reconciled")[0].status != "True"
            : true
      - name: "nodepoolReconciledTTL"
        expression: |
          (timestamp(now()) - timestamp(
            status.conditions.filter(c, c.type == "Reconciled").size() > 0
              ? status.conditions.filter(c, c.type == "Reconciled")[0].last_transition_time
              : now()
          )).getSeconds() > 300

  - name: "validationCheck"
    expression: |
      nodepoolNotReconciled || nodepoolReconciledTTL || is_deleting

resources:
  - name: "nodepoolConfigMap"
    transport:
      client: "desire"
      desire:
        target_cluster: "{{ .placementClusterName }}"
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ .nodepoolId | lower }}-adapter3-configmap"
        namespace: "{{ .namespace }}"
        labels:
          hyperfleet.io/nodepool-id: "{{ .nodepoolId }}"
          hyperfleet.io/nodepool-name: "{{ .nodepoolName }}"
          hyperfleet.io/adapter: "{{ .adapter.name }}"
        annotations:
          hyperfleet.io/generation: "{{ .generation }}"
      data:
        nodepool_id: "{{ .nodepoolId }}"
        nodepool_name: "{{ .nodepoolName }}"
    discovery:
      namespace: "{{ .namespace }}"
      by_name: "{{ .nodepoolId | lower }}-adapter3-configmap"
    lifecycle:
      delete:
        propagationPolicy: "Background"
        when:
          expression: "is_deleting"

post:
  payloads:
    - name: "statusPayload"
      build:
        adapter: "{{ .adapter.name }}"
        conditions:
          - type: "Applied"
            status:
              expression: |
                resources.?nodepoolConfigMap.?metadata.?creationTimestamp.hasValue() ? "True" : "False"
            reason:
              expression: |
                resources.?nodepoolConfigMap.?metadata.?creationTimestamp.hasValue() ? "ConfigMapApplied" : "ConfigMapPending"
            message:
              expression: |
                resources.?nodepoolConfigMap.?metadata.?creationTimestamp.hasValue()
                  ? "ConfigMap applied successfully"
                  : "ConfigMap pending"
          - type: "Available"
            status:
              expression: |
                resources.?nodepoolConfigMap.?data.?nodepool_id.hasValue() ? "True" : "False"
            reason:
              expression: |
                resources.?nodepoolConfigMap.?data.?nodepool_id.hasValue() ? "DataAvailable" : "DataNotAvailable"
            message:
              expression: |
                resources.?nodepoolConfigMap.?data.?nodepool_id.hasValue()
                  ? "ConfigMap data available"
                  : "ConfigMap data not yet available"
          - type: "Health"
            status:
              expression: |
                adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                ? "True"
                : "False"
            reason:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                ? "ExecutionFailed:" + adapter.?executionError.?phase.orValue("unknown")
                : adapter.?resourcesSkipped.orValue(false)
                  ? "ResourcesSkipped"
                  : "Healthy"
            message:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                ? "Adapter failed: " + adapter.?executionError.?message.orValue("no details")
                : adapter.?resourcesSkipped.orValue(false)
                  ? "Resources skipped: " + adapter.?skipReason.orValue("unknown reason")
                  : "Adapter execution completed successfully"
          - type: "Finalized"
            status:
              expression: |
                !is_deleting
                  ? "False"
                  : (!resources.?nodepoolConfigMap.hasValue() ? "True" : "False")
            reason:
              expression: |
                !is_deleting
                  ? "ResourceActive"
                  : (!resources.?nodepoolConfigMap.hasValue() ? "CleanupConfirmed" : "CleanupInProgress")
            message:
              expression: |
                !is_deleting
                  ? "Resource is active"
                  : (!resources.?nodepoolConfigMap.hasValue()
                      ? "All resources deleted successfully"
                      : "Deletion in progress")
        observed_generation:
          expression: "observedGeneration"
        observed_time: "{{ now | date \"2006-01-02T15:04:05Z07:00\" }}"
        data:
          configmap:
            name:
              expression: |
                resources.?nodepoolConfigMap.?metadata.?name.orValue("")
            nodepoolId:
              expression: |
                resources.?nodepoolConfigMap.?data.?nodepool_id.orValue("")

  post_actions:
    - name: "reportNodepoolStatus"
      api_call:
        method: "PUT"
        url: "/clusters/{{ .clusterId }}/nodepools/{{ .nodepoolId }}/statuses"
        headers:
          - name: "Content-Type"
            value: "application/json"
        body: "{{ .statusPayload }}"
