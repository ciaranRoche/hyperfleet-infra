# HyperFleet Adapter deployment configuration — desire-based delivery (POC)
adapter:
  name: adapter2

debug_config: true
log:
  level: debug

clients:
  hyperfleet_api:
    base_url: http://hyperfleet-api:8000
    version: v1
    timeout: 2s
    retry_attempts: 3
    retry_backoff: exponential

  broker:
    subscription_id: "placeholder"
    topic: "placeholder"

# Desire store backends
stores:
  redis-local:
    type: redis
    redis:
      address: "redis.hyperfleet.svc.cluster.local:6379"
      db: 0

# Named transports — resources reference these by name
transports:
  local:
    type: kubernetes
  remote:
    type: desire
    desire:
      target_cluster: "{{ .placementClusterName }}"
      spec_store: redis-local
      status_store: redis-local
