# HyperFleet Adapter task configuration — desire-based delivery (POC)
#
# This replaces the Maestro ManifestWork config. Instead of writing a full
# ManifestWork with nested manifests, feedbackRules, and manifestConfigs,
# the adapter author writes plain Kubernetes manifests. The framework wraps
# them as desires and writes them to the configured store.
params:
  - name: "clusterId"
    source: "event.id"
    type: "string"
    required: true

  - name: "generation"
    source: "event.generation"
    type: "int"
    required: true

  - name: "namespace"
    source: "env.NAMESPACE"
    type: "string"

preconditions:
  - name: "clusterStatus"
    api_call:
      method: "GET"
      url: "/clusters/{{ .clusterId }}"
      timeout: 10s
      retry_attempts: 3
      retry_backoff: "exponential"
    capture:
      - name: "clusterName"
        field: "name"
      - name: "generation"
        field: "generation"
      - name: "timestamp"
        field: "created_time"
      - name: "is_deleting"
        expression: "clusterStatus.?deleted_time.hasValue()"
      - name: "reconciledConditionStatus"
        expression: |
          status.conditions.filter(c, c.type == "Reconciled").size() > 0
            ? status.conditions.filter(c, c.type == "Reconciled")[0].status
            : "False"
      - name: "placementClusterName"
        expression: "\"cluster1\""

    conditions:
      - field: "reconciledConditionStatus"
        operator: "equals"
        value: "False"

  - name: "validationCheck"
    expression: |
      reconciledConditionStatus == "False" || is_deleting

# Resources — plain Kubernetes manifests, no ManifestWork wrapping.
# Each resource is individually tracked as a desire. No bundling.
resources:
  - name: "clusterNamespace"
    transport:
      client: "desire"
      desire:
        target_cluster: "{{ .placementClusterName }}"
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ .clusterId | lower }}-{{ .adapter.name }}-namespace"
        labels:
          hyperfleet.io/cluster-id: "{{ .clusterId }}"
          hyperfleet.io/adapter: "{{ .adapter.name }}"
        annotations:
          hyperfleet.io/generation: "{{ .generation }}"
    discovery:
      by_name: "{{ .clusterId | lower }}-{{ .adapter.name }}-namespace"
    lifecycle:
      delete:
        propagationPolicy: Foreground
        when:
          expression: "is_deleting && !resources.?clusterConfigMap.hasValue()"

  - name: "clusterConfigMap"
    transport:
      client: "desire"
      desire:
        target_cluster: "{{ .placementClusterName }}"
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ .clusterId | lower }}-{{ .adapter.name }}-configmap"
        namespace: "{{ .clusterId | lower }}-{{ .adapter.name }}-namespace"
        labels:
          hyperfleet.io/cluster-id: "{{ .clusterId }}"
          hyperfleet.io/adapter: "{{ .adapter.name }}"
        annotations:
          hyperfleet.io/generation: "{{ .generation }}"
      data:
        cluster_id: "{{ .clusterId }}"
        cluster_name: "{{ .clusterId }}"
    discovery:
      namespace: "{{ .clusterId | lower }}-{{ .adapter.name }}-namespace"
      by_name: "{{ .clusterId | lower }}-{{ .adapter.name }}-configmap"
    lifecycle:
      delete:
        propagationPolicy: Background
        when:
          expression: "is_deleting"

post:
  payloads:
    - name: "statusPayload"
      build:
        adapter: "{{ .adapter.name }}"
        conditions:
          # Applied: Check if the desire was applied successfully
          - type: "Applied"
            status:
              expression: |
                resources.?clusterNamespace.?status.?phase.orValue("") == "Active"
                  && resources.?clusterConfigMap.hasValue()
                ? "True"
                : "False"
            reason:
              expression: |
                !resources.?clusterNamespace.hasValue()
                  ? "NamespaceNotDiscovered"
                  : resources.?clusterNamespace.?status.?phase.orValue("") != "Active"
                    ? "NamespaceNotActive"
                    : !resources.?clusterConfigMap.hasValue()
                      ? "ConfigMapNotDiscovered"
                      : "Applied"
            message:
              expression: |
                !resources.?clusterNamespace.hasValue()
                  ? "Namespace not yet discovered from desire store"
                  : resources.?clusterNamespace.?status.?phase.orValue("") != "Active"
                    ? "Namespace not yet active"
                    : !resources.?clusterConfigMap.hasValue()
                      ? "ConfigMap not yet discovered from desire store"
                      : "All resources applied successfully"

          # Available: Resources are available on the target cluster
          - type: "Available"
            status:
              expression: |
                resources.?clusterNamespace.?status.?phase.orValue("") == "Active"
                  && resources.?clusterConfigMap.hasValue()
                ? "True"
                : "False"
            reason:
              expression: |
                !resources.?clusterNamespace.hasValue()
                  ? "NamespaceNotDiscovered"
                  : resources.?clusterNamespace.?status.?phase.orValue("") != "Active"
                    ? "NamespaceNotActive"
                    : !resources.?clusterConfigMap.hasValue()
                      ? "ConfigMapNotDiscovered"
                      : "AllResourcesAvailable"
            message:
              expression: |
                !resources.?clusterNamespace.hasValue()
                  ? "Namespace not yet discovered"
                  : resources.?clusterNamespace.?status.?phase.orValue("") != "Active"
                    ? "Namespace not yet active"
                    : !resources.?clusterConfigMap.hasValue()
                      ? "ConfigMap not yet discovered"
                      : "All resources available on target cluster"

          # Health: Adapter execution status
          - type: "Health"
            status:
              expression: |
                adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                ? "True"
                : "False"
            reason:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                ? "ExecutionFailed:" + adapter.?executionError.?phase.orValue("unknown")
                : adapter.?resourcesSkipped.orValue(false)
                  ? "ResourcesSkipped"
                  : "Healthy"
            message:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                ? "Adapter failed at phase ["
                    + adapter.?executionError.?phase.orValue("unknown")
                    + "] step ["
                    + adapter.?executionError.?step.orValue("unknown")
                    + "]: "
                    + adapter.?executionError.?message.orValue("no details")
                : adapter.?resourcesSkipped.orValue(false)
                  ? "Resources skipped: " + adapter.?skipReason.orValue("unknown reason")
                  : "Adapter execution completed successfully"

          # Finalized: Deletion lifecycle completion
          - type: "Finalized"
            status:
              expression: |
                !is_deleting
                  ? "False"
                  : (!resources.?clusterNamespace.hasValue()
                      && !resources.?clusterConfigMap.hasValue()
                      ? "True"
                      : "False")
            reason:
              expression: |
                !is_deleting
                  ? "ResourceActive"
                  : (!resources.?clusterNamespace.hasValue()
                      && !resources.?clusterConfigMap.hasValue()
                      ? "CleanupConfirmed"
                      : "CleanupInProgress")
            message:
              expression: |
                !is_deleting
                  ? "Resource is active, not scheduled for deletion"
                  : (!resources.?clusterNamespace.hasValue()
                      && !resources.?clusterConfigMap.hasValue()
                      ? "All resources deleted successfully"
                      : "Deletion in progress")

        observed_generation:
          expression: "generation"
        observed_time: "{{ now | date \"2006-01-02T15:04:05Z07:00\" }}"

        data:
          configmap:
            name:
              expression: |
                has(resources.clusterConfigMap) && has(resources.clusterConfigMap.metadata)
                ? resources.clusterConfigMap.metadata.name
                : ""
            clusterId:
              expression: |
                has(resources.clusterConfigMap) && has(resources.clusterConfigMap.data) && has(resources.clusterConfigMap.data.cluster_id)
                ? resources.clusterConfigMap.data.cluster_id
                : clusterId
          namespace:
            name:
              expression: |
                has(resources.clusterNamespace) && has(resources.clusterNamespace.metadata)
                ? resources.clusterNamespace.metadata.name
                : ""
            phase:
              expression: |
                has(resources.clusterNamespace) && has(resources.clusterNamespace.status) && has(resources.clusterNamespace.status.phase)
                ? resources.clusterNamespace.status.phase
                : "Unknown"

  post_actions:
    - name: "reportClusterStatus"
      api_call:
        method: "PUT"
        url: "/clusters/{{ .clusterId }}/statuses"
        headers:
          - name: "Content-Type"
            value: "application/json"
        body: "{{ .statusPayload }}"
